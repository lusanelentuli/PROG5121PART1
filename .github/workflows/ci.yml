name: Java CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download JUnit
        run: |
          mkdir libs
          wget -q -P libs https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          wget -q -P libs https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
      - name: Run tests
        run: ant -noinput -Dlibs.junit.classpath=libs/junit-4.13.2.jar:libs/hamcrest-core-1.3.jar -Dlibs.junit_4.classpath=libs/junit-4.13.2.jar:libs/hamcrest-core-1.3.jar test
